name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ./backend/pnpm-lock.yaml

      - name: Start PostgreSQL with retry
        run: |
          for i in 1 2 3; do
            docker rm -f postgres 2>/dev/null || true
            docker run -d --name postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=mangalovers-db-tests \
              -p 5432:5432 \
              postgres:16-alpine && break
            echo "Docker pull/run attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
          docker ps | grep postgres

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            docker exec postgres pg_isready && break
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mangalovers-db-tests

      - run: pnpm lint

      - run: pnpm test
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/mangalovers-db-tests
          JWT_SECRET: ci-test-jwt-secret
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret
          FRONTEND_URL: http://localhost:5173
          VAPID_PUBLIC_KEY: test-vapid-public-key
          VAPID_PRIVATE_KEY: test-vapid-private-key
          VAPID_EMAIL: ci@test.com

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
        env:
          VITE_API_URL: /api
